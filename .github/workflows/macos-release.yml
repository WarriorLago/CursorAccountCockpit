name: macOS DMG Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private source ref to build
        required: true
        default: main
      version:
        description: macOS version
        required: true
        default: 2.0.2
      publish_release:
        description: Publish GitHub Release after building
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: macos-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            runner: macos-15
            rust_target: aarch64-apple-darwin
            asset_arch: arm64
            verify_arch: arm64
            minimum: "11.0"
            config: src-tauri/tauri.macos-modern.conf.json
            update_key: darwin-aarch64-app
          - label: Intel
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            asset_arch: x64
            verify_arch: x86_64
            minimum: "10.15"
            config: src-tauri/tauri.macos-intel.conf.json
            update_key: darwin-x86_64-app
          - label: Universal
            runner: macos-15
            rust_target: universal-apple-darwin
            asset_arch: universal
            verify_arch: universal
            minimum: "11.0"
            config: src-tauri/tauri.macos-modern.conf.json
            update_key: macos-universal-dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: WarriorLago/CursorAccountCockpit-source
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Verify requested source version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./platform-versions.json').macos")" = "$VERSION"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          key: macos-${{ inputs.version }}-${{ matrix.asset_arch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync macOS version
        env:
          CURSOR_ACCOUNT_COCKPIT_PLATFORM: macos
          CURSOR_ACCOUNT_COCKPIT_MACOS_UPDATE_MANIFEST_URL: https://warriorlago.github.io/CursorAccountCockpit/updates/macos/latest.json
          CURSOR_ACCOUNT_COCKPIT_UPDATE_PLATFORM_KEY: ${{ matrix.update_key }}
        run: npm run sync-version

      - name: Build DMG
        shell: bash
        env:
          CURSOR_ACCOUNT_COCKPIT_PLATFORM: macos
          CURSOR_ACCOUNT_COCKPIT_MACOS_UPDATE_MANIFEST_URL: https://warriorlago.github.io/CursorAccountCockpit/updates/macos/latest.json
          CURSOR_ACCOUNT_COCKPIT_UPDATE_PLATFORM_KEY: ${{ matrix.update_key }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Keep the .app beside the DMG so the following architecture, minimum-OS,
          # embedded Mach-O and code-signature checks inspect the exact bundle.
          npx tauri build --ci --bundles app,dmg --config '${{ matrix.config }}' --target '${{ matrix.rust_target }}'

      - name: Verify bundle architecture and minimum OS
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="target/${{ matrix.rust_target }}/release/bundle"
          app="$(find "$bundle_root/macos" -maxdepth 1 -name '*.app' -print -quit)"
          dmg="$(find "$bundle_root/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$app"
          test -s "$dmg"

          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          executable="$app/Contents/MacOS/$executable_name"
          test -x "$executable"
          strings "$executable" | grep -F 'https://warriorlago.github.io/CursorAccountCockpit/updates/macos/latest.json'
          strings "$executable" | grep -F '${{ matrix.update_key }}'

          # Tauri's certificate-free bundle can carry an incomplete ad-hoc resource
          # envelope. Re-sign the complete .app, then put that exact verified bundle
          # back into the styled DMG so both artifacts have consistent integrity.
          codesign --force --deep --sign - "$app"
          bash scripts/release/verify_macos_bundle.sh "$app" '${{ matrix.verify_arch }}' '${{ matrix.minimum }}'

          original_mount="$(mktemp -d)"
          staged_volume="$(mktemp -d)"
          rebuilt_dmg="${dmg%.dmg}-verified.dmg"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$original_mount"
          ditto "$original_mount/" "$staged_volume/"
          hdiutil detach "$original_mount"
          ditto "$app" "$staged_volume/$(basename "$app")"
          hdiutil create -volname "Cursor Account Cockpit" -srcfolder "$staged_volume" -ov -format UDZO "$rebuilt_dmg"
          mv "$rebuilt_dmg" "$dmg"

          verify_mount="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$verify_mount"
          packaged_app="$(find "$verify_mount" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$packaged_app"
          bash scripts/release/verify_macos_bundle.sh "$packaged_app" '${{ matrix.verify_arch }}' '${{ matrix.minimum }}'
          hdiutil detach "$verify_mount"

      - name: Stage versioned DMG
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bundle_root="target/${{ matrix.rust_target }}/release/bundle"
          dmg="$(find "$bundle_root/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -s "$dmg"
          mkdir -p release-output
          cp "$dmg" "release-output/Cursor-Account-Cockpit-${VERSION}-macos-${{ matrix.asset_arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.asset_arch }}
          path: release-output/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub macOS release
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: dist
          merge-multiple: true

      - name: Generate checksums and macOS OTA manifest
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum Cursor-Account-Cockpit-${VERSION}-macos-*.dmg > Cursor-Account-Cockpit-${VERSION}-macOS-SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          version = os.environ['VERSION']
          repo = os.environ['REPO']
          base = f"https://github.com/{repo}/releases/download/v{version}"
          specs = {
              'macos-universal-dmg': f'Cursor-Account-Cockpit-{version}-macos-universal.dmg',
              'darwin-aarch64-app': f'Cursor-Account-Cockpit-{version}-macos-arm64.dmg',
              'darwin-x86_64-app': f'Cursor-Account-Cockpit-{version}-macos-x64.dmg',
          }
          platforms = {}
          for key, name in specs.items():
              path = Path(name)
              payload = path.read_bytes()
              platforms[key] = {
                  'url': f'{base}/{name}',
                  'sha256': hashlib.sha256(payload).hexdigest(),
                  'size': len(payload),
              }
          manifest = {
              'version': version,
              'publishedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'notes': f'macOS {version}: reliable OTA channel, Intel, Apple Silicon and Universal compatibility.',
              'notesZh': f'macOS {version}：修复 OTA 更新通道，并适配 Intel、Apple Silicon 与 Universal。',
              'platforms': platforms,
          }
          Path('macos-latest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          cat Cursor-Account-Cockpit-${VERSION}-macOS-SHA256SUMS.txt
          cat macos-latest.json

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## macOS ${VERSION}

          - Apple Silicon（M1–M5）：macOS 11 及以上
          - Intel Mac：macOS 10.15 及以上
          - 同时提供 Apple Silicon、Intel 和 Universal DMG
          - 发布前校验 Mach-O 架构、最低系统版本与代码签名完整性
          - 使用稳定 OTA 清单地址，按芯片架构下载对应更新包

          Windows 继续使用独立版本线。
          EOF
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" --title "Cursor Account Cockpit macOS v${VERSION}" --notes-file release-notes.md --latest=false
          else
            gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --title "Cursor Account Cockpit macOS v${VERSION}" --notes-file release-notes.md --latest=false
          fi
          gh release upload "v${VERSION}" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish stable macOS OTA channel file
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p updates/macos
          cp dist/macos-latest.json updates/macos/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/macos/latest.json
          if git diff --cached --quiet; then
            echo "Stable macOS OTA manifest is already current"
          else
            git commit -m "release(macos): publish OTA channel ${VERSION}"
            git push origin HEAD:main
          fi

      - name: Refresh legacy pinned macOS manifests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # 2.0.1-2.0.3 test/release builds used a version-pinned manifest URL.
          # Keep existing legacy releases as relay points to the newest channel.
          for tag in v2.0.1 v2.0.2 v2.0.3; do
            if [ "$tag" = "v${VERSION}" ]; then continue; fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$tag" dist/macos-latest.json --repo "$GITHUB_REPOSITORY" --clobber
              echo "Refreshed legacy relay $tag"
            fi
          done

      - name: Verify published assets
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          curl -fL --retry 5 -o published.json "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/macos-latest.json"
          jq -e --arg version "$VERSION" '.version == $version and .platforms["macos-universal-dmg"] and .platforms["darwin-aarch64-app"] and .platforms["darwin-x86_64-app"]' published.json >/dev/null
